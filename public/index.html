<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d14"><meta name="description" content="Listado de counters y códigos QR."><title>QR Counter</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="dsp.css"><link rel="stylesheet" href="vault.css"></head>
<body><main class="vault"><header class="masthead"><a class="brand" href="./"><img src="icon.svg" alt="" width="36" height="36"><span>DSPTools <b>/ QR Counter</b></span></a></header>
<section class="search-panel hero"><h1>QR de Counters</h1><div class="filters"><label class="field"><span>Buscar counter</span><input id="search" type="search" placeholder="Nombre, dirección, ciudad o código manual" autocomplete="off"></label><label class="field"><span>Ciudad</span><select id="city"><option value="">Todas las ciudades</option></select></label><button class="secondary" id="clear" type="button">Limpiar filtros</button></div></section>
<section class="results-panel vault-results" aria-labelledby="list-title"><div class="results-toolbar"><div><h2 id="list-title">Counters</h2><p id="count" role="status">Cargando counters…</p></div></div><div class="table-wrap"><table class="counter-table"><thead><tr><th>Nombre</th><th>Dirección</th><th>Ciudad</th><th>QR</th><th>Código manual</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="vault-empty" hidden><span class="empty-icon" aria-hidden="true">▦</span><h3 id="empty-title">Sin counters</h3><p id="empty-text">No hay counters guardados.</p></div></section>
</main>
<dialog id="qr-dialog" aria-labelledby="qr-title"><div class="dialog-head"><div><p class="eyebrow" id="qr-id"></p><h2 id="qr-title"></h2></div><button class="icon-button" id="close-dialog" aria-label="Cerrar QR">×</button></div><p id="qr-address"></p><div class="qr-frame"><img id="qr-image" alt=""></div><p id="qr-error" role="alert" hidden>No se pudo cargar la imagen del QR.</p><div class="manual-block"><span>Código manual</span><strong id="qr-code"></strong><button class="primary-button" id="copy-dialog">Copiar código manual</button></div></dialog><div id="toast" class="toast" role="status" hidden></div><script type="module" src="app.js"></script></body></html>
